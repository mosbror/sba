services:
  frontend:
    image: ghcr.io/${GHCR_OWNER}/sba-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_API_INTERNAL_BASE: http://backend:8080/api
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      caddy:
        aliases:
          - sba-app
      internal:

  backend:
    image: ghcr.io/${GHCR_OWNER}/sba-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-SBA}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER:-log}
      TRUSTED_PROXIES: '*'
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://sba-app.mosnet.cyou}
      CORS_SUPPORTS_CREDENTIALS: ${CORS_SUPPORTS_CREDENTIALS:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      caddy:
        aliases:
          - sba-api
      internal:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  caddy:
    external: true
  internal:
    internal: true

volumes:
  mysql_data:
  redis_data:
